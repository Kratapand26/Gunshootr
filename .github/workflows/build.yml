name: CI Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build Patch Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Patch MPP Bundle
        run: ./gradlew :patches:build --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Patch MPP Bundle
        id: bundle
        run: |
          VERSION=$(sed -n 's/^version=//p' gradle.properties)
          BUNDLE="patches/build/libs/patches-${VERSION}.mpp"
          python3 tools/verify_patch_bundle.py "$BUNDLE" --version "$VERSION" --metadata patches-bundle.json --dexdump "$ANDROID_HOME/build-tools/34.0.0/dexdump"
          echo "path=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            patches/build/test-results/test/*.xml
            extensions/linkedin/build/test-results/testReleaseUnitTest/*.xml
          if-no-files-found: ignore

      - name: Upload MPP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: patches-bundle
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
