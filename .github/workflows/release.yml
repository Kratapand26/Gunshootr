name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New stable version tag (e.g. v1.0.7)'
        required: true

concurrency:
  group: gunshootr-release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release Patch Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Release Version
        id: vars
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be built from main."
            exit 1
          fi
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Enter a stable version tag such as v1.0.7."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "This release tag already exists; choose a new version."
            exit 1
          fi
          VERSION="${TAG#v}"
          CURRENT=$(sed -n 's/^version=//p' gradle.properties)
          if [[ "$VERSION" == "$CURRENT" || "$(printf '%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]]; then
            echo "The release version must be newer than $CURRENT."
            exit 1
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Sync Version in Metadata Files
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          TAG="${{ steps.vars.outputs.tag }}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          sed -i "s/^version=.*/version=${VERSION}/" gradle.properties

          cat <<EOF > patches-bundle.json
          {
            "created_at": "${NOW}",
            "description": "Gunshootr Patches ${TAG}",
            "download_url": "https://github.com/Kratapand26/Gunshootr/releases/download/${TAG}/patches-${VERSION}.mpp",
            "signature_download_url": "",
            "version": "${VERSION}"
          }
          EOF

      - name: Build Patch MPP Bundle
        run: ./gradlew :patches:build :patches:generatePatchesList -Pversion=${{ steps.vars.outputs.version }} --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Patch MPP Bundle
        run: python3 tools/verify_patch_bundle.py "patches/build/libs/patches-${{ steps.vars.outputs.version }}.mpp" --version "${{ steps.vars.outputs.version }}" --dexdump "$ANDROID_HOME/build-tools/34.0.0/dexdump"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            patches/build/test-results/test/*.xml
            extensions/linkedin/build/test-results/testReleaseUnitTest/*.xml
          if-no-files-found: ignore

      - name: Commit & Push Version Bump to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties patches-bundle.json patches-list.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): Bump version to ${{ steps.vars.outputs.tag }} [skip ci]"
          fi
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Gunshootr Patches ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            patches/build/libs/patches-${{ steps.vars.outputs.version }}.mpp
            patches-bundle.json
            patches-list.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

